# Plugin coordinates
pluginGroup = xyz.reactvision.eskiu
pluginVersion = 0.3.0

# IntelliJ platform to build against. 2023.2+ has the stable TextMateBundleProvider API.
# Set this to your target IDE build (e.g. 2024.1 = 241.x). See:
# https://plugins.jetbrains.com/docs/intellij/
platformType = IC
platformVersion = 2023.2

# The platform TextMate plugin we contribute the bundle to.
platformBundledPlugins = org.jetbrains.plugins.textmate

org.gradle.jvmargs = -Xmx2g
