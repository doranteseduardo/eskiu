name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22 + toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libc++-dev libc++abi-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev clang-22
          echo "LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Configure & build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$LLVM_DIR \
            -DCMAKE_CXX_COMPILER=clang++-22
          cmake --build build --target eskiuc -j"$(nproc)"
          # Dual-build (promotion P4): the C++ seed builds the Eskiu-written compiler too.
          cmake --build build --target eskiuc-selfhost -j"$(nproc)"

      # The full test suite, three ways. The sanitizer runs are the hardening
      # gate: a class of codegen bug (e.g. allocas leaking stack inside loops)
      # shows up here even when the plain run passes. clang-22 keeps the asan
      # ABI in sync with the compiler's own instrumentation.
      - name: Tests
        run: CC=clang-22 tests/run.sh

      - name: Tests (ubsan)
        run: CC=clang-22 SANITIZE=ubsan tests/run.sh

      - name: Tests (asan)
        run: CC=clang-22 SANITIZE=asan tests/run.sh

      # Bounded, deterministic fuzz pass: generates/mutates programs and fails on
      # any compiler crash, IR-verifier failure, or O0-vs-O2 runtime divergence.
      # ESKIU_CLANG enables the differential oracle (clang installed as clang-22).
      # Fixed seed so a green run is reproducible; raise --iterations for nightly.
      - name: Fuzz (compiler)
        run: ESKIU_CLANG=clang-22 python3 tests/fuzz/eskiu_fuzz.py --iterations 1500 --seed 1

      # -O0 vs -O2 behavioral differential over the whole corpus: a program must
      # behave identically with and without the middle-end optimizer. Catches
      # optimization-path miscompiles (bad IR attributes, type/ABI mismatches, UB)
      # that -O0 tolerates but -O2 exploits — e.g. the 0.3.1 float-closure fix.
      - name: Optimization differential (-O0 vs -O2)
        run: CC=clang-22 tests/opt_differential.sh

      # `--safe` inserts runtime slice/array bounds checks that trap on a violation,
      # are off by default (opt-in, zero release cost), and leave in-bounds code alone.
      - name: Safe mode (bounds checks)
        run: CC=clang-22 tests/safe_mode.sh

      # `?*T` checked nullable pointer: unchecked deref rejected, `if (x != null)`
      # narrows, `*T` widens to `?*T` but not vice-versa. (C++ compiler; self-host
      # mirror is on the promotion track.)
      - name: Nullable pointers
        run: CC=clang-22 tests/nullable.sh

      # Self-hosted lexer (selfhost/) must stay byte-identical to the C++ lexer
      # over the whole preprocessor-free corpus. The driver is compiled once to a
      # native binary, so this is ~seconds. A divergence means the Eskiu lexer (or
      # the C++ lexer it mirrors) changed.
      - name: Lexer self-host parity
        run: tests/selfhost/lex_parity.sh --full

      # Self-hosted parser (selfhost/parser.esk) must produce an AST dump byte-
      # identical to the C++ --test-parser over the import-free corpus. Compiles
      # the driver once; ~seconds. Excludes files that import or that the C++
      # --test-parser itself can't print (top-level prototypes crash its printer).
      - name: Parser self-host parity
        run: tests/selfhost/parse_parity.sh --full

      # Self-hosted preprocessor (selfhost/preprocessor.esk) validated through the
      # lexer: pp_main preprocesses + lexes and must match the C++ --test-lexer
      # (which preprocesses too) over the whole tests/ + stdlib/ corpus — no
      # exclusions, since every directive is now handled. Compiles once; ~seconds.
      - name: Preprocessor self-host parity
        run: tests/selfhost/pp_parity.sh --full

      # Self-hosted type checker (selfhost/sema.esk) must reach the same verdict as
      # the C++ --test-typechecker over the positive corpus (no false rejections),
      # and reject the implemented tests/errors classes with the right message.
      # Compiles tc_main once; ~seconds.
      - name: Sema self-host parity
        run: tests/selfhost/tc_parity.sh

      # Self-hosted code generator (selfhost/codegen.esk): emit LLVM IR, compile it
      # with clang, run, and compare exit code + stdout to the C++-built binary over
      # the synthetic corpus. Behavioral oracle (IR can't match byte-for-byte). clang
      # is installed as clang-22 on the runner.
      - name: Codegen self-host parity
        run: CLANG=clang-22 tests/selfhost/cg_parity.sh

      # Phase D bootstrap gate: cg_main emits valid IR for the WHOLE self-hosted
      # compiler (lexer→codegen + drivers), and cg_main compiled by ITSELF reproduces
      # the C++-built codegen's IR byte-for-byte (a self-consistent fixpoint).
      - name: Codegen self-compilation (bootstrap fixpoint)
        run: CLANG=clang-22 tests/selfhost/cg_selfhost.sh

      # Three-stage bootstrap over the unified driver (esk_main.esk: pp→parse→sema→
      # codegen): the C++ eskiuc builds it (cc0), cc0 builds it (cc1), cc1 builds it
      # (cc2); cc1 and cc2 must emit identical IR (stage2 ≡ stage3 = a true fixpoint),
      # and cc2 must compile a runnable program.
      - name: Compiler bootstrap (3-stage fixpoint)
        run: CLANG=clang-22 tests/selfhost/cg_bootstrap.sh

      # Self-hosted driver end to end: esk_main.esk parses/checks/codegens AND invokes
      # clang to link a native binary. Compare the resulting binaries' exit + stdout to
      # the C++ eskiuc's over a small corpus (promotion P0).
      - name: Driver self-host parity
        run: CLANG=clang-22 tests/selfhost/driver_parity.sh

      # `eskiuc run script.esk`: compile to a temp exe, execute, propagate exit code.
      # Compare the self-host `run` to the C++ `run` over the same corpus (promotion P2).
      - name: Run self-host parity
        run: CLANG=clang-22 tests/selfhost/run_parity.sh

      # `eskiuc fmt`: the self-host reformatter must be byte-identical to the C++ one
      # over the whole in-repo corpus (implies idempotency; promotion P2).
      - name: Fmt self-host parity
        run: CLANG=clang-22 tests/selfhost/fmt_parity.sh

      # Whole-corpus behavioral equivalence: every positive test compiled by the
      # Eskiu-built compiler produces the same exit + stdout as the C++ one (promotion P3;
      # the negative-corpus verdict + diagnostic side is covered by tc_parity above).
      - name: Corpus behavioral parity
        run: CLANG=clang-22 tests/selfhost/corpus_parity.sh

      # `--safe` bounds-check mirror: the self-host emits the same runtime slice/array
      # bounds checks as the C++ back-end (OOB traps, in-bounds does not, off by default).
      - name: Safe-mode self-host parity
        run: CC=clang-22 tests/selfhost/safe_parity.sh
