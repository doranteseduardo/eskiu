name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          brew install llvm cmake
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$LLVM_DIR

      - name: Build
        run: cmake --build build --target eskiuc -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib/eskiu
          cp build/eskiuc dist/bin/eskiuc
          strip dist/bin/eskiuc
          cp -r stdlib dist/lib/eskiu/stdlib
          tar -czf eskiuc-macos-arm64.tar.gz -C dist bin lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskiuc-macos-arm64
          path: eskiuc-macos-arm64.tar.gz
          # Transient build→release handoff only; the real binaries are attached to
          # the GitHub Release. Expire fast so they don't pile up in Actions storage.
          retention-days: 7

  # ── Linux x86_64 ───────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev
          echo "LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$LLVM_DIR \
            -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build build --target eskiuc -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib/eskiu
          cp build/eskiuc dist/bin/eskiuc
          strip dist/bin/eskiuc
          cp -r stdlib dist/lib/eskiu/stdlib
          tar -czf eskiuc-linux-x86_64.tar.gz -C dist bin lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskiuc-linux-x86_64
          path: eskiuc-linux-x86_64.tar.gz
          # Transient build→release handoff only; the real binaries are attached to
          # the GitHub Release. Expire fast so they don't pile up in Actions storage.
          retention-days: 7

  # ── Windows x86_64 ─────────────────────────────────────────────────────
  # Built under MSYS2/MinGW, whose LLVM package ships the dev libraries + CMake
  # config the tool links against. ESKIU_STATIC pulls LLVM in statically, and the
  # static libgcc/libstdc++/winpthread flags keep the .exe free of MSYS runtime DLLs.
  build-windows-x86_64:
    runs-on: windows-latest
    # Unverified until this runs on CI: don't let a Windows build failure block the
    # macOS/Linux release. If it succeeds, the .zip is attached; if not, the release
    # still publishes (action-gh-release skips a missing file in `files:`).
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 + LLVM
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: |
          # Build with MinGW g++ (not clang++): clang cannot parse the newer
          # libstdc++ 16 preprocessor headers this toolchain ships, and the MSYS2
          # LLVM libs are built with this same g++, so the ABI matches.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DESKIU_STATIC=ON \
            -DLLVM_DIR="$MINGW_PREFIX/lib/cmake/llvm" \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"

      - name: Build
        run: cmake --build build --target eskiuc -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib/eskiu
          cp build/eskiuc.exe dist/bin/eskiuc.exe
          strip dist/bin/eskiuc.exe
          cp -r stdlib dist/lib/eskiu/stdlib
          # Zip via PowerShell so the archive is a native Windows .zip.
          powershell -Command "Compress-Archive -Path dist/bin,dist/lib -DestinationPath eskiuc-windows-x86_64.zip -Force"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskiuc-windows-x86_64
          path: eskiuc-windows-x86_64.zip
          retention-days: 7

  # ── GitHub Release ─────────────────────────────────────────────────────
  release:
    needs: [build-macos-arm64, build-linux-x86_64, build-windows-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Eskiu ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          overwrite: true
          files: |
            eskiuc-macos-arm64.tar.gz
            eskiuc-linux-x86_64.tar.gz
            eskiuc-windows-x86_64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
